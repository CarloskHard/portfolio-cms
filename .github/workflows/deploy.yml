name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            cd /var/www/portfolio-cms

            # Medida de seguridad: el reset --hard machacaría cualquier cambio
            # local sin comitear en el servidor, así que abortamos si los hay.
            if [ -n "$(git status --porcelain)" ]; then
              echo "❌ Deploy abortado: hay cambios locales sin comitear en el servidor:"
              git status --short
              exit 1
            fi

            git remote set-url origin https://github.com/CarlosBTav/Portfolio-with-CRM.git
            git fetch origin main
            git reset --hard origin/main

            npm ci
            npm run build

            php artisan view:clear
            php artisan config:clear
            php artisan route:clear
            php artisan optimize

            echo "✅ Deploy completado: $(date)"
